# 发布到 npmjs。
# 认证二选一：
#   A. npmjs Trusted Publishing（推荐）：在 npmjs 上为本仓库启用 OIDC 发布授权，
#      本 workflow 无需任何 token，--provenance 自动走 OIDC。
#   B. 传统方式：仓库 Secrets 配置 NPM_TOKEN（Publish 权限），并在下方 publish 步骤
#      恢复 env: { NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }。
name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance（OIDC 发布签名）
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package version $PKG"; exit 1; }

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Publish to npm
        run: npm publish --provenance --access public
